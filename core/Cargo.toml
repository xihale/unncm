[package]
name = "unncm-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "unncm_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8.4"
base64 = "0.22.1"
jni = { version = "0.21.1", default-features = false }
libc = "0.2.175"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
